name: Codeman
description: Runs an AI agent on opted-in issues and pull requests, asking a human for decisions before it acts.
author: codenergy
inputs:
  step:
    description: "Which job of the Codeman workflow this is: select, open-key, agent, close-key, apply or release-pod."
    required: true
  github-token:
    description: "(select, apply) GitHub App installation token. (agent) The job's GITHUB_TOKEN, to download workflow results."
  workflow-token:
    description: "(apply) GitHub App token that may write workflows, only when accepting staged workflows."
  app-slug:
    description: "(select) Slug of the GitHub App, used to recognize Codeman's own comments."
  settings:
    description: "(select) Settings shared by several repositories, such as an organization's variable, in the format of .codeman/settings.yml. Defaults that the repository's file overrides, value by value. Empty means none. Plain text: never secrets."
  firebase-project:
    description: "(select, open-key, close-key, release-pod) The Firebase project of Codeman's backend, whose Firestore database records each run. Required; the templates pass the CODEMAN_FIREBASE_PROJECT variable."
  workload-identity-provider:
    description: "(select, open-key, close-key, release-pod) The Workload Identity provider that admits the job's OIDC token, as projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>. Required; the templates pass the CODEMAN_WORKLOAD_IDENTITY_PROVIDER variable. The job needs the id-token: write permission."
  service-account:
    description: "(select, open-key, close-key, release-pod) The email of the service account the job acts as in the backend's project. Required; the templates pass the CODEMAN_SERVICE_ACCOUNT variable."
  ledger-run:
    description: "(open-key, close-key, release-pod) The run's ID in Codeman's ledger, from select's tasks."
  model:
    description: "(select) Model ID: OpenRouter's, or the self-hosted engine's. Empty uses .codeman/settings.yml. Maintainers can override it per task with /codeman set."
  task-budget:
    description: "(select, open-key) Spending limit of each task, across all its runs, in USD. In select, empty uses .codeman/settings.yml or 2."
  monthly-budget:
    description: "(select, open-key) Spending limit per repository per calendar month, in USD. In select, empty uses .codeman/settings.yml or 20."
  organization-monthly-budget:
    description: "(open-key) Spending limit per calendar month of the organization's repositories together, in USD, from select's tasks. Only the organization's settings (the settings input) set it. Empty means none."
  max-runs:
    description: "(select) Consecutive implementation runs before a task is blocked. Empty uses .codeman/settings.yml or 3."
  key-expiry-hours:
    description: "(open-key) Hours until a task key expires."
    default: "24"
  task:
    description: "(open-key, agent, apply) Issue number of the job's task, one of select's tasks. agent and apply read its context; empty, as from older workflow files, reads the only one they had."
  management-key:
    description: "(open-key, close-key) OpenRouter management key, for OpenRouter inference. Without it, open-key does not refresh what the task's expired OpenRouter runs cost."
  inference:
    description: "(open-key, close-key, release-pod) The run's inference, as select outputs it: its profile, and every provider the settings name. Empty is OpenRouter."
  gpu-key:
    description: "(open-key, close-key, release-pod) The GPU provider's account key, for self-hosted inference. With organization-monthly-budget, open-key also needs it when the settings name the provider or the organization's runs used it this month, to read its account's billing."
  pod-image:
    description: "(open-key) Codeman's pod image, by digest. Empty uses the image this version of Codeman pins."
  serverless-key:
    description: "(agent) Key of the Serverless endpoint, restricted to it, for self-hosted inference on Serverless. Only the gateway outside the sandbox holds it."
  handle:
    description: "(agent, close-key, release-pod) The run's handle, from open-key."
  base-url:
    description: "(agent) The OpenAI-compatible API of the run's pod, from open-key."
  context-length:
    description: "(agent) The model's context length, from open-key."
  gateway-usage:
    description: "(close-key) What the agent job's gateway measured, for self-hosted inference on Serverless, with the times the endpoint's worker was billed for the run, which close-key splits in Codeman's ledger with the runs that shared them."
  encryption-secret:
    description: "(open-key, agent) Secret that encrypts the task key between jobs. At least 32 characters."
  encrypted-key:
    description: "(agent) The task key, encrypted by open-key."
  key-hash:
    description: "(close-key) Hash of the task key to disable, from older workflow files; newer ones pass handle."
  harness:
    description: "(agent) Agent harness to run."
    default: opencode
  agent-minutes:
    description: "(agent) Minutes the agent may run before it is stopped. Keep it below the job's timeout."
    default: "50"
  key-job-result:
    description: "(apply) Result of the open-key job."
  key-status:
    description: "(apply) Status output of the open-key job."
  key-reason:
    description: "(apply) Reason output of the open-key job."
  agent-job-result:
    description: "(close-key, apply) Result of the agent job."
  task-spent:
    description: "(apply) task-spent output of the open-key job."
  task-total:
    description: "(apply) task-total output of the close-key job."
  organization-month-spent:
    description: "(apply) organization-month-spent output of the open-key job."
  run-cost:
    description: "(apply) run-cost output of the close-key job."
  key-limit:
    description: "(apply) key-limit output of the open-key job."
  month-spent:
    description: "(apply) month-spent output of the open-key job."
  input-tokens:
    description: "(apply) input-tokens output of the close-key job."
  output-tokens:
    description: "(apply) output-tokens output of the close-key job."
  requests:
    description: "(apply) requests output of the close-key job."
  max-input-tokens:
    description: "(apply) max-input-tokens output of the close-key job."
  tokens-per-second:
    description: "(apply) tokens-per-second output of the close-key job."
  task-costs:
    description: "(apply) task-costs output of the close-key job."
  pod:
    description: "(apply) pod output of the close-key job."
  pod-shared:
    description: "(apply) pod-shared output of the close-key job."
  workdir:
    description: "Directory for Codeman's files. Defaults to RUNNER_TEMP/codeman."
outputs:
  tasks:
    description: "(select) The tasks this run works on, up to parallel-tasks, as a JSON list: for each, its task, action, needs-agent, stage, base-sha, task-budget, monthly-budget and inference, as the outputs of those names describe them, organization-monthly-budget (empty when the organization's settings set none), and ledger-run, the run's ID in Codeman's ledger (empty without an agent). Empty when there is nothing to do."
  action:
    description: "(select) What this run does for its first task: plan, route, implement, record, accept; none when there is nothing to do."
  needs-agent:
    description: "(select) Whether the first task needs a key and the agent: true or false."
  stage:
    description: "(select) What the agent works on: plan, route, design, code, test or review. The first task's."
  task:
    description: "(select) Issue number of the first task."
  model:
    description: "(select) Model for the first task."
  base-sha:
    description: "(select) Commit the agent starts from. The first task's."
  task-budget:
    description: "(select) Resolved spending limit of the task key, in USD. The first task's."
  monthly-budget:
    description: "(select) Resolved monthly spending limit, in USD."
  inference:
    description: "(select) Where the run gets its model, as JSON, for the key jobs: the inference profile that applies, the task's spend from its record, every provider the settings name and, with several tasks, the run's other tasks. The first task's."
  status:
    description: "(open-key) opened, over-budget (the repository's month), over-organization-budget (the organization's month), task-budget-spent, or missing-credentials (a provider the run needs has no secret)."
  task-spent:
    description: "(open-key) What the task spent before this run, in USD, from Codeman's ledger."
  task-total:
    description: "(close-key) What the task spent in all after this run, in USD, from Codeman's ledger."
  run-cost:
    description: "(close-key) What this run's key spent, in USD."
  key-limit:
    description: "(open-key) The limit of this run's key, in USD."
  month-spent:
    description: "(open-key) What the repository's runs count this month before this run, in USD, from Codeman's ledger: costs, and open runs' limits."
  organization-month-spent:
    description: "(open-key) What the organization's runs count this month before this run, in USD, with its GPU accounts' billing by the hour; only with organization-monthly-budget."
  input-tokens:
    description: "(close-key) Input tokens of this run's key, from OpenRouter's analytics."
  output-tokens:
    description: "(close-key) Output tokens of this run's key, from OpenRouter's analytics."
  requests:
    description: "(close-key) Requests made with this run's key, from OpenRouter's analytics."
  max-input-tokens:
    description: "(close-key) Input tokens of the largest request of this run's key, from OpenRouter's analytics."
  tokens-per-second:
    description: "(close-key) Mean completion tokens per second of this run's key's requests, from OpenRouter's analytics."
  task-costs:
    description: "(close-key) What each run of the task spent, in USD, by workflow run ID, as JSON, from Codeman's ledger."
  reason:
    description: "(open-key) Why no key was created."
  key-hash:
    description: "(open-key) The run's handle, under its older name: for OpenRouter, the hash of the task key."
  handle:
    description: "(open-key) What close-key needs to end the run: an OpenRouter key's hash, or a self-hosted run's JSON."
  base-url:
    description: "(open-key) The OpenAI-compatible API of the run's pod, for self-hosted inference."
  context-length:
    description: "(open-key) The model's context length, when known."
  pod:
    description: "(close-key) The pod that served the run, for self-hosted inference."
  pod-shared:
    description: "(close-key) true when the run's pod serves several tasks: the ledger counts the task's share of it, as the pod's gateway measured it, not the pod's billing."
  kept-pod:
    description: "(close-key) The pod the task keeps for the next run on its settings; release-pod ends the task's keep lease if the task does not go on, and terminates the pod when no other task uses or keeps it."
  gateway-usage:
    description: "(agent) What the agent job's gateway measured, for self-hosted inference on Serverless: its usage, and the times its estimate counts, left out when they would not fit in GitHub's job outputs."
  encrypted-key:
    description: "(open-key) The task key, encrypted."
  chain:
    description: "(apply) Whether to start another run: true or false. When true, apply also writes a mark of its task under the workdir's chain/ directory, for the workflow to upload."
  continues:
    description: "(apply) Whether the task goes on to another agent run: true or false."
runs:
  using: node24
  main: dist/index.js
branding:
  icon: git-pull-request
  color: gray-dark
