name: Codeman
description: Runs an AI agent on opted-in issues and pull requests, asking a human for decisions before it acts.
author: codenergy
inputs:
  step:
    description: "Which job of the Codeman workflow this is: select, open-key, agent, close-key, apply or release-pod."
    required: true
  github-token:
    description: "(select, apply) GitHub App installation token. (agent) The job's GITHUB_TOKEN, to download workflow results."
  workflow-token:
    description: "(apply) GitHub App token that may write workflows, only when accepting staged workflows."
  app-slug:
    description: "(select) Slug of the GitHub App, used to recognize Codeman's own comments."
  settings:
    description: "(select) Settings shared by several repositories, such as an organization's variable, in the format of .codeman/settings.yml. Defaults that the repository's file overrides, value by value. Empty means none. Plain text: never secrets."
  model:
    description: "(select) Model ID: OpenRouter's, or the self-hosted engine's. Empty uses .codeman/settings.yml. Maintainers can override it per task with /codeman set."
  task-budget:
    description: "(select, open-key) Spending limit of each task, across all its runs, in USD. In select, empty uses .codeman/settings.yml or 2."
  monthly-budget:
    description: "(select, open-key) Spending limit per repository per calendar month, in USD. In select, empty uses .codeman/settings.yml or 20."
  max-runs:
    description: "(select) Consecutive implementation runs before a task is blocked. Empty uses .codeman/settings.yml or 3."
  key-expiry-hours:
    description: "(open-key) Hours until a task key expires."
    default: "24"
  task:
    description: "(open-key) Issue number of the selected task."
  management-key:
    description: "(open-key, close-key) OpenRouter management key, for OpenRouter inference."
  inference:
    description: "(open-key, close-key, release-pod) The task's inference, as select outputs it. Empty is OpenRouter."
  gpu-key:
    description: "(open-key, close-key, release-pod) The GPU provider's account key, for self-hosted inference."
  pod-image:
    description: "(open-key) Codeman's pod image, by digest. Empty uses the image this version of Codeman pins."
  serverless-key:
    description: "(agent) Key of the Serverless endpoint, restricted to it, for self-hosted inference on Serverless. Only the gateway outside the sandbox holds it."
  handle:
    description: "(agent, close-key, release-pod) The run's handle, from open-key."
  base-url:
    description: "(agent) The OpenAI-compatible API of the run's pod, from open-key."
  context-length:
    description: "(agent) The model's context length, from open-key."
  gateway-usage:
    description: "(close-key) What the agent job's gateway measured, for self-hosted inference on Serverless."
  encryption-secret:
    description: "(open-key, agent) Secret that encrypts the task key between jobs. At least 32 characters."
  encrypted-key:
    description: "(agent) The task key, encrypted by open-key."
  key-hash:
    description: "(close-key) Hash of the task key to disable, from older workflow files; newer ones pass handle."
  harness:
    description: "(agent) Agent harness to run."
    default: opencode
  agent-minutes:
    description: "(agent) Minutes the agent may run before it is stopped. Keep it below the job's timeout."
    default: "50"
  key-job-result:
    description: "(apply) Result of the open-key job."
  key-status:
    description: "(apply) Status output of the open-key job."
  key-reason:
    description: "(apply) Reason output of the open-key job."
  agent-job-result:
    description: "(apply) Result of the agent job."
  task-spent:
    description: "(apply) task-spent output of the open-key job."
  run-cost:
    description: "(apply) run-cost output of the close-key job."
  key-limit:
    description: "(apply) key-limit output of the open-key job."
  month-spent:
    description: "(apply) month-spent output of the open-key job."
  input-tokens:
    description: "(apply) input-tokens output of the close-key job."
  output-tokens:
    description: "(apply) output-tokens output of the close-key job."
  requests:
    description: "(apply) requests output of the close-key job."
  max-input-tokens:
    description: "(apply) max-input-tokens output of the close-key job."
  tokens-per-second:
    description: "(apply) tokens-per-second output of the close-key job."
  task-costs:
    description: "(apply) task-costs output of the close-key job."
  pod:
    description: "(apply) pod output of the close-key job."
  pod-costs:
    description: "(apply) pod-costs output of the close-key job."
  workdir:
    description: "Directory for Codeman's files. Defaults to RUNNER_TEMP/codeman."
outputs:
  action:
    description: "(select) What this run does: plan, route, implement, record, accept or none."
  needs-agent:
    description: "(select) Whether this run needs a key and the agent: true or false."
  stage:
    description: "(select) What the agent works on: plan, route, design, code, test or review."
  task:
    description: "(select) Issue number of the selected task."
  model:
    description: "(select) Model for the selected task."
  base-sha:
    description: "(select) Commit the agent starts from."
  task-budget:
    description: "(select) Resolved spending limit of the task key, in USD."
  monthly-budget:
    description: "(select) Resolved monthly spending limit, in USD."
  inference:
    description: "(select) Where the task's runs get their model, as JSON, for the key jobs."
  status:
    description: "(open-key) opened, over-budget (monthly) or task-budget-spent."
  task-spent:
    description: "(open-key) What the task spent before this run, in USD."
  run-cost:
    description: "(close-key) What this run's key spent, in USD."
  key-limit:
    description: "(open-key) The limit of this run's key, in USD."
  month-spent:
    description: "(open-key) What the repository spent this month before this run, in USD."
  input-tokens:
    description: "(close-key) Input tokens of this run's key, from OpenRouter's analytics."
  output-tokens:
    description: "(close-key) Output tokens of this run's key, from OpenRouter's analytics."
  requests:
    description: "(close-key) Requests made with this run's key, from OpenRouter's analytics."
  max-input-tokens:
    description: "(close-key) Input tokens of the largest request of this run's key, from OpenRouter's analytics."
  tokens-per-second:
    description: "(close-key) Mean completion tokens per second of this run's key's requests, from OpenRouter's analytics."
  task-costs:
    description: "(close-key) What each run of the task spent, in USD, by run ID, as JSON."
  reason:
    description: "(open-key) Why no key was created."
  key-hash:
    description: "(open-key) The run's handle, under its older name: for OpenRouter, the hash of the task key."
  handle:
    description: "(open-key) What close-key needs to end the run: an OpenRouter key's hash, or a self-hosted run's JSON."
  base-url:
    description: "(open-key) The OpenAI-compatible API of the run's pod, for self-hosted inference."
  context-length:
    description: "(open-key) The model's context length, when known."
  pod:
    description: "(close-key) The pod that served the run, for self-hosted inference."
  pod-costs:
    description: "(close-key) What each of the task's pods cost so far, in USD, as JSON: its billing, or the run's pod's whole life at its rate when higher."
  kept-pod:
    description: "(close-key) The pod kept for the task's next run, which release-pod terminates if none follows."
  gateway-usage:
    description: "(agent) What the agent job's gateway measured, for self-hosted inference on Serverless."
  encrypted-key:
    description: "(open-key) The task key, encrypted."
  chain:
    description: "(apply) Whether to start another run: true or false."
  continues:
    description: "(apply) Whether the task goes on to another agent run: true or false."
runs:
  using: node24
  main: dist/index.js
branding:
  icon: git-pull-request
  color: gray-dark
