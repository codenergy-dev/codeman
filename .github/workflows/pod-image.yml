# Builds Codeman's pod images, one per engine (the targets of docker/pod/Dockerfile), and publishes
# each to GitHub's container registry as codeman-<engine>. Each is then pinned by digest in
# src/inference/images.ts, by a reviewed commit. A new package is private: make it public once,
# after its first publish (docs/development/guide.md#pod-images).
name: Pod image

on:
  push:
    branches: [main]
    paths:
      - docker/pod/**
      - dist/gateway.js
      - .github/workflows/pod-image.yml
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # vLLM's base image is 9 GB compressed: its first pull and push take a while.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # One engine's failure does not cancel the other's publish.
      fail-fast: false
      matrix:
        engine: [ollama, vllm]
    env:
      ENGINE: ${{ matrix.engine }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/codeman-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's disk does not hold vLLM's image unpacked beside its preinstalled toolchains,
      # which no step here uses.
      - name: Free disk space
        if: matrix.engine == 'vllm'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # dist/gateway.js is checked against the source by CI, so the image needs no npm install.
      # The labels replace the base image's, such as vLLM's source, which GHCR would link the
      # package to.
      - name: Build
        run: |
          docker build --pull --platform linux/amd64 --target "$ENGINE" -f docker/pod/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" dist
      - name: Publish
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          echo "Published \`$digest\` ($ENGINE). Pin it as \`$ENGINE\` in \`src/inference/images.ts\`; a new package must be made public first." >> "$GITHUB_STEP_SUMMARY"
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
