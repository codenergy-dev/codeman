# Started only by hand, for one of two checks:
# - `suite`: the end-to-end suite on GitHub's standard runners. Every key in it is a fake's: its job
#   names no environment, so it reads no secret, and must stay so.
# - `pod`: real pods on Runpod (e2e/live/pod.ts), which cost money. Only its job names the `E2E`
#   environment, and only its two steps that call Runpod get the key.
# See docs/development/e2e/suite.md#on-github-actions.
name: E2E

on:
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run.
        type: choice
        options: [suite, pod]
        default: suite
      selectors:
        description: Scenarios to run in one job, as paths or tags separated by a space. Empty runs every scenario, one job per Docker profile.
        type: string
        required: false
      gpu:
        description: The pod check's GPU type; auto takes the cheapest with room for each check, under its cost cap.
        type: choice
        options:
          - auto
          - NVIDIA RTX A4000
          - NVIDIA RTX A4500
          - NVIDIA RTX A5000
          - NVIDIA GeForce RTX 3090
          - NVIDIA GeForce RTX 4090
          - NVIDIA L4
          - NVIDIA RTX 4000 Ada Generation
        default: auto
      pod-checks:
        description: The pod check's checks, separated by commas, from ollama, vllm, blocked and unfit.
        type: string
        default: ollama
      community:
        description: Let the pod check use Runpod's Community Cloud too, where hosts are third parties' machines.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  suite:
    name: Suite (${{ matrix.group }})
    if: inputs.check == 'suite'
    runs-on: ubuntu-24.04
    # Under GitHub's limit of 6 hours, and above the suite's step, so its report still uploads.
    timeout-minutes: 330
    strategy:
      # One group's failure does not cancel the others' runs.
      fail-fast: false
      matrix:
        # One group per job, since a runner's disk is short of both profiles' images. A new profile
        # in e2e/runtime/scenario/schema.ts needs its group here.
        group: ${{ fromJSON(inputs.selectors == '' && '["none","ollama","vllm"]' || '["selected"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # The scenarios under act need the audited release and the actions the templates pin.
      - name: Install act
        env:
          ACT_VERSION: 0.2.89
          ACT_SHA256: 0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0
        run: |
          mkdir "$RUNNER_TEMP/act"
          curl -fsSL -o "$RUNNER_TEMP/act/act.tar.gz" \
            "https://github.com/nektos/act/releases/download/v$ACT_VERSION/act_Linux_x86_64.tar.gz"
          echo "$ACT_SHA256  $RUNNER_TEMP/act/act.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/act/act.tar.gz" -C "$RUNNER_TEMP/act" act
          echo "CODEMAN_E2E_ACT=$RUNNER_TEMP/act/act" >> "$GITHUB_ENV"
      - run: node e2e/runtime/act/fill-cache.ts
      # On Linux, host.docker.internal is the default bridge's address, not the host's loopback,
      # where the pod launcher listens by default. A job's internal network has no route to it.
      - name: Listen for pods on the default bridge
        run: |
          bridge="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$bridge"
          echo "CODEMAN_E2E_LAUNCHER_HOST=$bridge" >> "$GITHUB_ENV"
      - name: Disk before the suite
        run: |
          df -h
          docker system df
      - name: Run the suite
        timeout-minutes: 300
        env:
          GROUP: ${{ matrix.group }}
          SELECTORS: ${{ inputs.selectors }}
        run: |
          if [ "$GROUP" != selected ]; then
            npm run test:e2e -- "--profile=$GROUP"
            exit
          fi
          # Words of letters, digits, '.', '_', '/' and '-', each starting with a letter or a digit
          # so that none is an option, separated by one space.
          word='[A-Za-z0-9][A-Za-z0-9._/-]*'
          if [[ ! "$SELECTORS" =~ ^$word(\ $word)*$ || "$SELECTORS" == *..* ]]; then
            echo "::error::The selectors must be paths or tags, separated by one space."
            exit 2
          fi
          read -r -a selectors <<< "$SELECTORS"
          npm run test:e2e -- "${selectors[@]}"
      - name: Disk after the suite
        if: always()
        run: |
          df -h
          docker system df
      # Every key in the report is a fake's. session.json, the fakes' control tokens, and act's
      # home and clones are not the report. e2e/.out is a hidden directory to this action.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report-${{ matrix.group }}
          path: |
            e2e/.out/
            !e2e/.out/session.json
            !e2e/.out/act/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  pod:
    name: Pod check
    if: inputs.check == 'pod'
    runs-on: ubuntu-24.04
    environment: E2E
    # One at a time: a run's cleanup terminates every pod the check tagged, another run's too.
    concurrency:
      group: pod-check
      cancel-in-progress: false
    # Above the script's own limit of 60 minutes, so its cleanup still runs.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Without the key: install scripts never see it.
      - run: npm ci
      # The script checks each input against a pattern, never repeats one, and prints only an
      # allowlist of values; it masks the key and every token it makes before using them.
      - name: Run the pod check
        timeout-minutes: 65
        env:
          CODEMAN_RUNPOD_API_KEY: ${{ secrets.CODEMAN_RUNPOD_API_KEY }}
          CODEMAN_POD_CHECK_GPU: ${{ inputs.gpu }}
          CODEMAN_POD_CHECK_CHECKS: ${{ inputs.pod-checks }}
          CODEMAN_POD_CHECK_COMMUNITY: ${{ inputs.community }}
        run: node e2e/live/pod.ts
      # Terminates every pod the check tagged, whatever happened above.
      - name: Terminate the check's pods
        if: always()
        timeout-minutes: 5
        env:
          CODEMAN_RUNPOD_API_KEY: ${{ secrets.CODEMAN_RUNPOD_API_KEY }}
        run: node e2e/live/pod.ts --cleanup
