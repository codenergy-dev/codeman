# Codeman workflow for a target repository. Copy it to .github/workflows/codeman.yml.
# Setup: https://github.com/codenergy-dev/codeman/blob/main/docs/installation.md
name: Codeman

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model ID. Empty uses the default below.
        type: string
      task-budget:
        description: Spending limit per task, in USD. Empty uses the default below.
        type: string
      monthly-budget:
        description: Spending limit per month for this repository, in USD. Empty uses the default below.
        type: string
  issue_comment:
    types: [created]

# One active run per repository. Each run reads the state of every task, so a
# queued run that GitHub replaces loses no work.
concurrency:
  group: codeman
  cancel-in-progress: false

permissions: {}

# Defaults for scheduled and comment runs, which have no inputs.
env:
  CODEMAN_MODEL: ${{ inputs.model || 'deepseek/deepseek-v4.1-flash' }}
  CODEMAN_TASK_BUDGET: ${{ inputs.task-budget || '2' }}
  CODEMAN_MONTHLY_BUDGET: ${{ inputs.monthly-budget || '20' }}

jobs:
  # Picks one task and decides what to do. No LLM.
  select:
    name: Select task
    # Comments only start a run when they mention /codeman and are not from a bot. Whether the
    # author may steer Codeman is checked in the job, from their permission on the repository:
    # author_association hides private organization members.
    if: >-
      github.event_name != 'issue_comment' || (
        contains(github.event.comment.body, '/codeman') &&
        github.event.comment.user.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.codeman.outputs.action }}
      task: ${{ steps.codeman.outputs.task }}
      base-sha: ${{ steps.codeman.outputs.base-sha }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          # Reads commenters' permission on the repository.
          permission-metadata: read
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: select
          github-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: ${{ env.CODEMAN_MODEL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.codeman.outputs.action != 'none'
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
          retention-days: 1

  # Creates a budget-capped OpenRouter key for this task. The only jobs with the management key
  # are this one and close-key.
  open-key:
    name: Open key
    needs: select
    if: needs.select.outputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.codeman.outputs.status }}
      reason: ${{ steps.codeman.outputs.reason }}
      key-hash: ${{ steps.codeman.outputs.key-hash }}
      encrypted-key: ${{ steps.codeman.outputs.encrypted-key }}
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: open-key
          task: ${{ needs.select.outputs.task }}
          task-budget: ${{ env.CODEMAN_TASK_BUDGET }}
          monthly-budget: ${{ env.CODEMAN_MONTHLY_BUDGET }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}

  # Runs the agent with read-only access. Its result is an artifact for the apply job.
  agent:
    name: Agent
    needs: [select, open-key]
    if: needs.open-key.outputs.status == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.base-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: agent
          encrypted-key: ${{ needs.open-key.outputs.encrypted-key }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}
          agent-minutes: 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Validates the result and writes it to GitHub: plan commit, labels, status comment. No LLM.
  apply:
    name: Apply
    needs: [select, open-key, agent]
    if: always() && needs.select.result == 'success' && needs.select.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.agent.result == 'success'
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: apply
          github-token: ${{ steps.app-token.outputs.token }}
          key-job-result: ${{ needs.open-key.result }}
          key-status: ${{ needs.open-key.outputs.status }}
          key-reason: ${{ needs.open-key.outputs.reason }}
          agent-job-result: ${{ needs.agent.result }}

  # Disables the task key, whatever happened. Disabled keys still count towards the monthly budget.
  close-key:
    name: Close key
    needs: [open-key, agent]
    if: always() && needs.open-key.outputs.key-hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: close-key
          key-hash: ${{ needs.open-key.outputs.key-hash }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
