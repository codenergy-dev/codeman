# Codeman workflow for a target repository. Copy it to .github/workflows/codeman.yml.
# Setup: https://github.com/codenergy-dev/codeman/blob/main/docs/installation.md
name: Codeman

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Empty inputs use .codeman/settings.yml, then Codeman's defaults. Scheduled and comment
    # runs have no inputs.
    inputs:
      model:
        description: OpenRouter model ID.
        type: string
      task-budget:
        description: Spending limit per task, in USD.
        type: string
      monthly-budget:
        description: Spending limit per month for this repository, in USD.
        type: string
      max-runs:
        description: Consecutive implementation runs before a task is blocked.
        type: string
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One active run per repository. Each run reads the state of every task, so a
# queued run that GitHub replaces loses no work.
concurrency:
  group: codeman
  cancel-in-progress: false

permissions: {}

jobs:
  # A review runs the workflow file from the pull request's branch, which may be older than the
  # default branch's. This job only starts the default branch's workflow, with no secrets. It
  # runs for reviews on Codeman's own branches that request changes or mention /codeman.
  forward-review:
    name: Forward review
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codeman/') && (
        github.event.review.state == 'changes_requested' ||
        contains(github.event.review.body, '/codeman')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run "$WORKFLOW" --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # Picks one task and decides what to do. No LLM.
  select:
    name: Select task
    # Comments only start a run when they mention /codeman and are not from a bot. Whether the
    # author may steer Codeman is checked in the job, from their permission on the repository:
    # author_association hides private organization members.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/codeman') &&
        github.event.comment.user.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.codeman.outputs.action }}
      needs-agent: ${{ steps.codeman.outputs.needs-agent }}
      task: ${{ steps.codeman.outputs.task }}
      base-sha: ${{ steps.codeman.outputs.base-sha }}
      task-budget: ${{ steps.codeman.outputs.task-budget }}
      monthly-budget: ${{ steps.codeman.outputs.monthly-budget }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          # Reads commenters' permission on the repository.
          permission-metadata: read
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: select
          github-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          model: ${{ inputs.model }}
          task-budget: ${{ inputs.task-budget }}
          monthly-budget: ${{ inputs.monthly-budget }}
          max-runs: ${{ inputs.max-runs }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.codeman.outputs.action != 'none'
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
          retention-days: 1

  # Creates a budget-capped OpenRouter key for this task. The only jobs with the management key
  # are this one and close-key.
  open-key:
    name: Open key
    needs: select
    if: needs.select.outputs.needs-agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.codeman.outputs.status }}
      reason: ${{ steps.codeman.outputs.reason }}
      key-hash: ${{ steps.codeman.outputs.key-hash }}
      encrypted-key: ${{ steps.codeman.outputs.encrypted-key }}
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: open-key
          task: ${{ needs.select.outputs.task }}
          task-budget: ${{ needs.select.outputs.task-budget }}
          monthly-budget: ${{ needs.select.outputs.monthly-budget }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}

  # Runs the agent with read-only access. Its result is an artifact for the apply job, even when
  # the agent fails or runs out of time, so unfinished work is kept.
  agent:
    name: Agent
    needs: [select, open-key]
    if: needs.open-key.outputs.status == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.base-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      # Set up the tools your project needs here, for example actions/setup-node. The agent gets
      # this job's PATH, except entries in the runner's home, and none of its other variables.
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: agent
          encrypted-key: ${{ needs.open-key.outputs.encrypted-key }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}
          agent-minutes: 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Validates the result and writes it to GitHub: commits, pull request, labels, status comment.
  # No LLM.
  apply:
    name: Apply
    needs: [select, open-key, agent]
    if: always() && needs.select.result == 'success' && needs.select.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      # A failed agent may still have left a result; apply decides what to keep.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.agent.result == 'success' || needs.agent.result == 'failure'
        continue-on-error: true
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: apply
          github-token: ${{ steps.app-token.outputs.token }}
          key-job-result: ${{ needs.open-key.result }}
          key-status: ${{ needs.open-key.outputs.status }}
          key-reason: ${{ needs.open-key.outputs.reason }}
          agent-job-result: ${{ needs.agent.result }}

  # Disables the task key, whatever happened. Disabled keys still count towards the monthly budget.
  close-key:
    name: Close key
    needs: [open-key, agent]
    if: always() && needs.open-key.outputs.key-hash != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: close-key
          key-hash: ${{ needs.open-key.outputs.key-hash }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
