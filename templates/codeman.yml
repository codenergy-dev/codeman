# Codeman workflow for a target repository. Copy it to .github/workflows/codeman.yml.
# Setup: https://github.com/codenergy-dev/codeman/blob/main/docs/installation.md
name: Codeman

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Empty inputs use .codeman/settings.yml, then the organization's settings, then Codeman's
    # defaults. Scheduled and comment runs have no inputs.
    inputs:
      model:
        description: Model ID, OpenRouter's or the self-hosted engine's.
        type: string
      task-budget:
        description: Spending limit per task, in USD.
        type: string
      monthly-budget:
        description: Spending limit per month for this repository, in USD.
        type: string
      max-runs:
        description: Consecutive implementation runs before a task is blocked.
        type: string
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One active run per repository. Each run reads the state of every task, so a
# queued run that GitHub replaces loses no work.
concurrency:
  group: codeman
  cancel-in-progress: false

permissions: {}

jobs:
  # A review runs the workflow file from the pull request's branch, which may be older than the
  # default branch's. This job only starts the default branch's workflow, with no secrets. It
  # runs for reviews on Codeman's own branches that request changes or mention /codeman.
  forward-review:
    name: Forward review
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codeman/') && (
        github.event.review.state == 'changes_requested' ||
        contains(github.event.review.body, '/codeman')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run "$WORKFLOW" --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  # Picks one task and decides what to do. No LLM.
  select:
    name: Select task
    # Comments only start a run when they mention /codeman and are not from a bot. Whether the
    # author may steer Codeman is checked in the job, from their permission on the repository:
    # author_association hides private organization members.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/codeman') &&
        github.event.comment.user.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.codeman.outputs.action }}
      needs-agent: ${{ steps.codeman.outputs.needs-agent }}
      stage: ${{ steps.codeman.outputs.stage }}
      task: ${{ steps.codeman.outputs.task }}
      base-sha: ${{ steps.codeman.outputs.base-sha }}
      task-budget: ${{ steps.codeman.outputs.task-budget }}
      monthly-budget: ${{ steps.codeman.outputs.monthly-budget }}
      inference: ${{ steps.codeman.outputs.inference }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          # Reads reviews on Codeman's pull requests.
          permission-pull-requests: read
          # Reads the runs of workflows the agent asked for.
          permission-actions: read
          # Reads commenters' permission on the repository.
          permission-metadata: read
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: select
          github-token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          # Settings an organization shares with its repositories, in the format of
          # .codeman/settings.yml; the repository's file overrides them. Unset is none. The
          # variable is plain text, shown in the logs: never put secrets in it.
          settings: ${{ vars.CODEMAN_SETTINGS }}
          model: ${{ inputs.model }}
          task-budget: ${{ inputs.task-budget }}
          monthly-budget: ${{ inputs.monthly-budget }}
          max-runs: ${{ inputs.max-runs }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.codeman.outputs.action != 'none'
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
          retention-days: 1

  # Gives this run access to its model, limited to what remains of the task's budget: an
  # OpenRouter key, or a token for a self-hosted model's gateway, which may start a pod. Only the
  # key jobs (this one, close-key and release-pod) hold the management and GPU account keys.
  open-key:
    name: Open key
    needs: select
    if: needs.select.outputs.needs-agent == 'true'
    runs-on: ubuntu-latest
    # A new pod may take up to 25 minutes to serve its model.
    timeout-minutes: 35
    outputs:
      status: ${{ steps.codeman.outputs.status }}
      reason: ${{ steps.codeman.outputs.reason }}
      task-spent: ${{ steps.codeman.outputs.task-spent }}
      month-spent: ${{ steps.codeman.outputs.month-spent }}
      key-limit: ${{ steps.codeman.outputs.key-limit }}
      key-hash: ${{ steps.codeman.outputs.key-hash }}
      handle: ${{ steps.codeman.outputs.handle }}
      base-url: ${{ steps.codeman.outputs.base-url }}
      context-length: ${{ steps.codeman.outputs.context-length }}
      encrypted-key: ${{ steps.codeman.outputs.encrypted-key }}
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: open-key
          task: ${{ needs.select.outputs.task }}
          task-budget: ${{ needs.select.outputs.task-budget }}
          monthly-budget: ${{ needs.select.outputs.monthly-budget }}
          inference: ${{ needs.select.outputs.inference }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
          gpu-key: ${{ secrets.CODEMAN_RUNPOD_API_KEY }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}

  # Runs the agent with read-only access. Its result is an artifact for the apply job, even when
  # the agent fails or runs out of time, so unfinished work is kept.
  agent:
    name: Agent (${{ needs.select.outputs.stage }})
    needs: [select, open-key]
    if: needs.open-key.outputs.status == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Downloads the results of workflows the agent asked for. The agent never sees the token.
      actions: read
    outputs:
      gateway-usage: ${{ steps.codeman.outputs.gateway-usage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.base-sha }}
          # All history, so the test and review stages can compare with the default branch
          # and merge it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      # Set up the tools your project needs here, for example actions/setup-node. The agent gets
      # this job's PATH, except entries in the runner's home, and none of its other variables.
      # Only install tools: a step that runs repository code (npm ci, make, tests) runs code the
      # agent wrote outside its sandbox, where it can read this job's secrets.
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: agent
          github-token: ${{ github.token }}
          encrypted-key: ${{ needs.open-key.outputs.encrypted-key }}
          encryption-secret: ${{ secrets.CODEMAN_OPENROUTER_KEY_ENCRYPTION_SECRET }}
          handle: ${{ needs.open-key.outputs.handle }}
          base-url: ${{ needs.open-key.outputs.base-url }}
          context-length: ${{ needs.open-key.outputs.context-length }}
          # Self-hosted inference on Serverless: held by the gateway outside the sandbox.
          serverless-key: ${{ secrets.CODEMAN_RUNPOD_SERVERLESS_KEY }}
          agent-minutes: 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  # Ends the run's access, whatever happened, and reads what the run and each earlier run of the
  # task spent: it disables the OpenRouter key, or ends the run on its pod, which it keeps for the
  # task's next run or terminates. Apply waits for it to report the spend.
  close-key:
    name: Close key
    needs: [select, open-key, agent]
    if: always() && (needs.open-key.outputs.handle != '' || needs.open-key.outputs.key-hash != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-cost: ${{ steps.codeman.outputs.run-cost }}
      input-tokens: ${{ steps.codeman.outputs.input-tokens }}
      output-tokens: ${{ steps.codeman.outputs.output-tokens }}
      requests: ${{ steps.codeman.outputs.requests }}
      max-input-tokens: ${{ steps.codeman.outputs.max-input-tokens }}
      tokens-per-second: ${{ steps.codeman.outputs.tokens-per-second }}
      task-costs: ${{ steps.codeman.outputs.task-costs }}
      pod: ${{ steps.codeman.outputs.pod }}
      pod-costs: ${{ steps.codeman.outputs.pod-costs }}
      kept-pod: ${{ steps.codeman.outputs.kept-pod }}
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: close-key
          handle: ${{ needs.open-key.outputs.handle }}
          key-hash: ${{ needs.open-key.outputs.key-hash }}
          inference: ${{ needs.select.outputs.inference }}
          gateway-usage: ${{ needs.agent.outputs.gateway-usage }}
          management-key: ${{ secrets.CODEMAN_OPENROUTER_MANAGEMENT_KEY }}
          gpu-key: ${{ secrets.CODEMAN_RUNPOD_API_KEY }}

  # Validates the result and writes it to GitHub: commits, pull request, labels, status comment.
  # No LLM.
  apply:
    name: Apply
    needs: [select, open-key, agent, close-key]
    if: always() && needs.select.result == 'success' && needs.select.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chain: ${{ steps.codeman.outputs.chain }}
      continues: ${{ steps.codeman.outputs.continues }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # Only when a maintainer accepted staged workflows: a token that may write them.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: workflow-token
        if: needs.select.outputs.action == 'accept'
        with:
          client-id: ${{ vars.CODEMAN_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEMAN_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeman-task
          path: ${{ runner.temp }}/codeman/task
      # A failed agent may still have left a result; apply decides what to keep.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.agent.result == 'success' || needs.agent.result == 'failure'
        continue-on-error: true
        with:
          name: codeman-result
          path: ${{ runner.temp }}/codeman/result
      - uses: codenergy-dev/codeman@COMMIT_SHA
        id: codeman
        with:
          step: apply
          github-token: ${{ steps.app-token.outputs.token }}
          workflow-token: ${{ steps.workflow-token.outputs.token }}
          key-job-result: ${{ needs.open-key.result }}
          key-status: ${{ needs.open-key.outputs.status }}
          key-reason: ${{ needs.open-key.outputs.reason }}
          agent-job-result: ${{ needs.agent.result }}
          task-spent: ${{ needs.open-key.outputs.task-spent }}
          run-cost: ${{ needs.close-key.outputs.run-cost }}
          key-limit: ${{ needs.open-key.outputs.key-limit }}
          month-spent: ${{ needs.open-key.outputs.month-spent }}
          input-tokens: ${{ needs.close-key.outputs.input-tokens }}
          output-tokens: ${{ needs.close-key.outputs.output-tokens }}
          requests: ${{ needs.close-key.outputs.requests }}
          max-input-tokens: ${{ needs.close-key.outputs.max-input-tokens }}
          tokens-per-second: ${{ needs.close-key.outputs.tokens-per-second }}
          task-costs: ${{ needs.close-key.outputs.task-costs }}
          pod: ${{ needs.close-key.outputs.pod }}
          pod-costs: ${{ needs.close-key.outputs.pod-costs }}

  # Terminates the pod close-key kept for the task's next run, when the task does not go on to
  # one now (or apply failed). A kept pod also terminates itself after 15 idle minutes.
  release-pod:
    name: Release pod
    needs: [select, open-key, close-key, apply]
    if: always() && needs.close-key.outputs.kept-pod != '' && needs.apply.outputs.continues != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: codenergy-dev/codeman@COMMIT_SHA
        with:
          step: release-pod
          handle: ${{ needs.open-key.outputs.handle }}
          inference: ${{ needs.select.outputs.inference }}
          gpu-key: ${{ secrets.CODEMAN_RUNPOD_API_KEY }}

  # Starts another run when this one moved a task, so the next task (or the next step of this
  # one) does not wait for the schedule. That run stops early when nothing can move. No secrets.
  next-run:
    name: Next run
    needs: apply
    # always(): without it, the skipped open-key and agent jobs of a run that only records
    # answers would skip this job too, even though apply succeeded.
    if: always() && needs.apply.result == 'success' && needs.apply.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: >-
          gh workflow run "$WORKFLOW" --repo "$REPOSITORY" --ref "$REF"
          -f model="$MODEL" -f task-budget="$TASK_BUDGET"
          -f monthly-budget="$MONTHLY_BUDGET" -f max-runs="$MAX_RUNS"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          # A manual run's inputs carry over; other runs have none.
          MODEL: ${{ inputs.model }}
          TASK_BUDGET: ${{ inputs.task-budget }}
          MONTHLY_BUDGET: ${{ inputs.monthly-budget }}
          MAX_RUNS: ${{ inputs.max-runs }}
