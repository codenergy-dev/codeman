# Codeman settings for a target repository. Copy it to .codeman/settings.yml.
# Only `name: value` lines and the list of profiles below are accepted.
# It inherits the organization's settings, if any, and workflow inputs and `/codeman set`
# override it.
# Reference: https://github.com/codenergy-dev/codeman/blob/main/docs/settings/reference.md

# Model ID, required here or as a workflow input, in the form the provider takes: OpenRouter's,
# Ollama's on Runpod pods, or the Hugging Face ID the vLLM worker serves on Runpod Serverless.
model: deepseek/deepseek-v4.1-flash

# Where agent runs get their model: openrouter (the default), runpod-pod or runpod-serverless.
# Each provider accepts only its own settings, below; any other stops the run with an error.
# See docs/settings/providers.md for the secrets each needs.
provider: openrouter

# runpod-pod: a GPU pod Codeman rents, which serves the model with Ollama.
# provider: runpod-pod
# The GPU type, by Runpod's GPU ID (not its display name); quote it. Required.
# A task can change it with /codeman set gpu.
# gpu: "NVIDIA RTX A6000"
# Keep the pod for the next run on its settings (task), or one pod per run (run).
# pod-reuse: task
# The engine: ollama, the only one on pods so far.
# engine: ollama

# runpod-serverless: the workers of a Serverless endpoint you created, running Runpod's vLLM worker.
# provider: runpod-serverless
# The endpoint's ID, or its URL from Runpod's console (https://api.runpod.ai/v2/<id>/...). Required.
# endpoint: abc123xyz
# The engine: vllm, the only one on Serverless.
# engine: vllm

# Profiles: a provider, a model and that provider's settings for some runs. The first profile
# whose conditions all hold applies; the top-level settings apply when none does. A profile
# inherits the top-level settings and sets only `provider`, `model` and the provider's settings;
# one on another provider than the top level's inherits none of that one's settings, and must
# set its own `model`. Conditions: `stages` (plan, route, web, design, code, test, review), and
# `parallel-tasks` (at least that many of the run's tasks run an agent).
# Each provider a run uses needs its secret; with the organization's monthly budget, so does the
# Runpod account of a Runpod provider named here, whose billing counts in the organization's
# month.
# profiles:
#   - name: small-pod
#     when:
#       stages: [code, test]
#     provider: runpod-pod
#     gpu: "NVIDIA RTX A6000"
#     model: qwen3-coder:30b

# Spending limit per task and per calendar month for this repository, in USD. The limit for all
# the organization's repositories, organization-monthly-budget, is set only in the organization's
# settings (the CODEMAN_SETTINGS variable).
task-budget: 2
monthly-budget: 20

# Consecutive implementation runs before a task is blocked.
max-runs: 3

# Tasks one run works on at once, from 1 to 10, each with its own key and agent. Above 1,
# tasks on pods with the same settings share one, and the workflow needs codeman-task.yml
# next to codeman.yml.
parallel-tasks: 1

# Limits on what one run may change.
max-files: 300
max-file-bytes: 1048576

# Limits on what the agent writes for the maintainers, as it is told them.
# Texts may be up to twice as long before Codeman cuts them.
max-decisions: 10
max-options: 4
max-title-chars: 80
max-question-chars: 600
max-label-chars: 150
max-summary-chars: 2000

# The language Codeman talks to maintainers in, as a BCP 47 tag such as pt-BR.
# `auto` uses the language of the issue and its comments.
language: auto
