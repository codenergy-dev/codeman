# Codeman settings for a target repository. Copy it to .codeman/settings.yml.
# Only `name: value` lines and the list of inference profiles below are accepted.
# Workflow inputs and `/codeman set` take precedence.
# Reference: https://github.com/codenergy-dev/codeman/blob/main/docs/architecture.md#settings

# Model ID, required here or as a workflow input: OpenRouter's, or, with self-hosted inference,
# the engine's (Ollama's on pods, the Hugging Face ID the vLLM worker serves on Serverless).
model: deepseek/deepseek-v4.1-flash

# Where agent runs get their model: openrouter, or self-hosted on GPUs rented from Runpod.
# See docs/installation.md for the secrets each needs.
# inference: self-hosted
# gpu-provider: runpod
# A pod rented for the run (pod), or the workers of a Serverless endpoint you created
# (serverless).
# gpu-mode: pod
# Pods: the GPU type, by Runpod's GPU ID (not its display name); quote it. A task can change it with /codeman set.
# gpu-type: "NVIDIA RTX A6000"
# Pods: keep the pod for the task's next run (task), or one pod per run (run).
# pod-reuse: task
# Serverless: the endpoint's ID.
# serverless-endpoint: abc123xyz

# Inference profiles: other inference settings for some runs. The first profile whose conditions
# all hold applies; the settings above apply when none does. A profile sets only `model` and the
# inference settings above. Conditions: `stages` (plan, route, web, design, code, test, review),
# and `parallel-tasks` (at least that many of the run's tasks run an agent).
# The month counts every provider named here, so the workflow needs each one's secret.
# inference-profiles:
#   - name: small-pod
#     when:
#       stages: [code, test]
#     inference: self-hosted
#     gpu-type: "NVIDIA RTX A6000"
#     model: qwen3-coder:30b

# Spending limit per task and per calendar month for this repository, in USD.
task-budget: 2
monthly-budget: 20

# Consecutive implementation runs before a task is blocked.
max-runs: 3

# Tasks one run works on at once, from 1 to 10, each with its own key and agent. Above 1,
# tasks on pods with the same settings share one, and the workflow needs codeman-task.yml
# next to codeman.yml.
parallel-tasks: 1

# Limits on what one run may change.
max-files: 300
max-file-bytes: 1048576

# Limits on what the agent writes for the maintainers, as it is told them.
# Texts may be up to twice as long before Codeman cuts them.
max-decisions: 10
max-options: 4
max-title-chars: 80
max-question-chars: 600
max-label-chars: 150
max-summary-chars: 2000

# The language Codeman talks to maintainers in, as a BCP 47 tag such as pt-BR.
# `auto` uses the language of the issue and its comments.
language: auto
