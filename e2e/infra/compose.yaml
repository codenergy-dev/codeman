# The e2e suite's infrastructure (docs/plans/2026-10-20-end-to-end-test-suite.md, steps 3.2-3.3):
# the fakes, Firestore's emulator and the session's test CA by default; the models' seeds in the
# `ollama` and `vllm` profiles; the job and pod images in the `images` profile, built but never
# started.
#
#   docker compose -f e2e/infra/compose.yaml --profile images build    # the job and pod images
#   docker compose -f e2e/infra/compose.yaml up --wait                 # the default profile
#   docker compose -f e2e/infra/compose.yaml --profile ollama up --wait
#   docker compose -f e2e/infra/compose.yaml down                      # keeps the named volumes
#
# Networks:
# - `jobs` (codeman-e2e-jobs) is internal: what joins only it reaches no other network and no
#   internet. Jobs and pods join only it; the fakes and the emulator answer there by name.
# - `control` (codeman-e2e-control) gives the host-side runtime the fakes' and the emulator's ports,
#   published on 127.0.0.1 only, on ports Docker picks (`docker compose port <service> <port>`).
#   Docker publishes no port of an internal network, so this one is not: the fakes, the suite's own
#   code, can reach out, while the jobs that call them cannot.
# - `egress` (codeman-e2e-egress) is the seeds' way to the registries, once.
#
# Variables, all optional, which the runtime sets:
# - CODEMAN_E2E_CONTROL_TOKEN: the token every fake's control API (/_fake/) then requires, so a job
#   on the jobs network cannot drive the fakes. Without it, the control API is open.
# - CODEMAN_E2E_LAUNCHER and CODEMAN_E2E_LAUNCHER_TOKEN: the host-side orchestrator's launcher API,
#   which starts the pods the fake Runpod creates (decision 2), such as
#   http://host.docker.internal:<port>. Without it, pods run and serve nothing.

name: codeman-e2e

# The fake GitHub's fixed address on the jobs network: libcurl sends `*.localhost` to 127.0.0.1, so
# git in the job image reaches the fake by this address (its http.curloptResolve).
x-github-address: &github-address 10.250.0.10
x-github-host: &github-host github-e2e.localhost

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The fakes image, for the fakes and for the one-shot services that run its code.
x-fakes-image: &fakes-image
  <<: *hardening
  image: codeman-e2e-fakes:local
  build:
    context: ../..
    dockerfile: e2e/infra/images/fakes/Dockerfile
  init: true
  read_only: true
  tmpfs: ["/tmp"]
  mem_limit: 192m
  memswap_limit: 192m

x-fake: &fake
  <<: *fakes-image
  environment: &fake-environment
    PORT: "8080"
    FAKE_CONTROL_TOKEN: ${CODEMAN_E2E_CONTROL_TOKEN:-}
  networks: [jobs, control]
  ports: ["127.0.0.1::8080"]
  # A TCP connection, not a request: requests would fill the fake's log for assertions.
  healthcheck: &fake-healthcheck
    test:
      - CMD
      - node
      - -e
      - require("net").connect(Number(process.env.PORT), "127.0.0.1").on("connect", () => process.exit(0)).on("error", () => process.exit(1))
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s
    start_interval: 1s

services:
  # The session's test CA and the fake GitHub's certificate, made once and kept in volumes while
  # valid (e2e/infra/certificates.ts). Jobs and pods mount only `ca`; only the fake GitHub, `tls`.
  certificates:
    <<: *fakes-image
    command:
      - node
      - e2e/infra/certificates.ts
      - /e2e/ca
      - /e2e/tls
      - *github-host
      - github
      - *github-address
      - localhost
      - 127.0.0.1
    network_mode: none
    volumes: [ca:/e2e/ca, tls:/e2e/tls]
    restart: "no"

  # HTTPS on 443 under a `*.localhost` name, which @actions/artifact requires (spike 0.2, 2c):
  # https://github-e2e.localhost, with /api/v3 and /api/graphql. gh, as for GitHub Enterprise
  # Server, takes GH_HOST=github-e2e.localhost and its token from GH_ENTERPRISE_TOKEN.
  github:
    <<: *fake
    command: [node, e2e/fakes/main.ts, github]
    environment:
      <<: *fake-environment
      PORT: "443"
      FAKE_TLS_KEY: /e2e/tls/server.key
      FAKE_TLS_CERT: /e2e/tls/server.crt
      FAKE_GITHUB_SERVER_URL: https://github-e2e.localhost
    volumes: [tls:/e2e/tls:ro]
    depends_on:
      certificates: { condition: service_completed_successfully }
    networks:
      jobs:
        ipv4_address: *github-address
        aliases: [*github-host]
      control: {}
    ports: ["127.0.0.1::443"]
    # git http-backend, a process per clone or push.
    mem_limit: 384m
    memswap_limit: 384m
    tmpfs: ["/tmp:size=256m"]

  # OIDC issuer, STS and IAM Credentials; a scenario sets it up through PUT /_fake/google/setup.
  google:
    <<: *fake
    command: [node, e2e/fakes/main.ts, google]

  # The scripted model, which the fake OpenRouter and the Serverless queues answer from.
  llm:
    <<: *fake
    command: [node, e2e/fakes/main.ts, llm]

  openrouter:
    <<: *fake
    command: [node, e2e/fakes/main.ts, openrouter]
    environment:
      <<: *fake-environment
      FAKE_OPENROUTER_MANAGEMENT_KEY: e2e-openrouter-management-key
      FAKE_OPENROUTER_COMPLETIONS: http://llm:8080
    depends_on:
      llm: { condition: service_healthy }

  runpod:
    <<: *fake
    command: [node, e2e/fakes/main.ts, runpod]
    environment:
      <<: *fake-environment
      FAKE_RUNPOD_LAUNCHER: ${CODEMAN_E2E_LAUNCHER:-}
      FAKE_RUNPOD_LAUNCHER_TOKEN: ${CODEMAN_E2E_LAUNCHER_TOKEN:-}
      FAKE_RUNPOD_WORKER: http://llm:8080
    # The orchestrator's launcher runs on the host; Docker Desktop names it, Linux needs the entry.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # It starts the pods, which mount the models: with a profile, `up --wait` waits for its seed
    # through this service. Without the profile, the seed is not required.
    depends_on:
      llm: { condition: service_healthy }
      seed-ollama: { condition: service_completed_successfully, required: false }
      seed-hf: { condition: service_completed_successfully, required: false }

  # OpenCode's tarballs (decision 4), from the volume seed-npm fills.
  npm:
    <<: *fake
    command: [node, e2e/fakes/main.ts, npm]
    environment:
      <<: *fake-environment
      FAKE_NPM_CACHE: /e2e/npm
    volumes: [npm:/e2e/npm:ro]
    depends_on:
      seed-npm: { condition: service_completed_successfully }

  # In the default profile, unlike the models: every agent job downloads OpenCode, whatever its
  # provider. fill.ts keeps a tarball that matches its pinned integrity, so a filled volume makes no
  # request. Its platform is this machine's, as the job image's is.
  seed-npm:
    <<: *fakes-image
    command: [node, e2e/fakes/npm/fill.ts, /e2e/npm]
    volumes: [npm:/e2e/npm]
    networks: [egress]
    restart: "no"
    mem_limit: 768m
    memswap_limit: 768m

  # Firestore's emulator, with Codeman's rules (decision 3). The store's tests reach it with
  # FIRESTORE_EMULATOR_HOST=127.0.0.1:<its published port>.
  firestore:
    <<: *hardening
    image: codeman-e2e-emulator:local
    build:
      context: images/emulator
      additional_contexts:
        firebase: ../../firebase
    init: true
    read_only: true
    tmpfs: ["/tmp", "/var/lib/emulator"]
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    networks: [jobs, control]
    ports: ["127.0.0.1::8080"]
    mem_limit: 1g
    memswap_limit: 1g

  # qwen2.5:0.5b in the Ollama models volume, checked by its manifest's digest (seeds/ollama.sh).
  seed-ollama:
    <<: *hardening
    profiles: [ollama]
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    entrypoint: [/bin/sh, /seeds/ollama.sh]
    command: []
    volumes: [ollama:/root/.ollama/models, ./seeds:/seeds:ro]
    networks: [egress]
    restart: "no"
    mem_limit: 1g
    memswap_limit: 1g

  # Qwen/Qwen2.5-0.5B-Instruct at its pinned commit in the Hugging Face cache volume, checked by the
  # weights' SHA-256 (seeds/hf.sh), with the hf command of vLLM's CPU image.
  seed-hf:
    <<: *hardening
    profiles: [vllm]
    image: vllm/vllm-openai-cpu:v0.31.0@sha256:495c84fe30f3572b83a78100a1e8ba423dbb77fc532ecefebe114e6b77327bd9
    entrypoint: [/bin/sh, /seeds/hf.sh]
    command: []
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    volumes: [hf:/root/.cache/huggingface, ./seeds:/seeds:ro]
    networks: [egress]
    restart: "no"
    mem_limit: 1g
    memswap_limit: 1g

  # The pod images (e2e/infra/images/pod-ollama/, pod-vllm/), which stand in for Codeman's pinned
  # ones (e2e/infra/pod-images.ts). Never started here: the host-side orchestrator runs each pod the
  # fake Runpod creates (decision 2), with `docker run --init` on the jobs network, the pod's env,
  # the tee's variables, and the `ollama` volume on /root/.ollama/models or the `hf` volume on
  # /root/.cache/huggingface, read-only. Both build from dist/, as the production images do.
  pod-ollama-base:
    profiles: [images]
    image: codeman-pod-ollama:local
    build:
      context: ../../dist
      dockerfile: ../docker/pod/Dockerfile
      target: ollama
  pod-ollama:
    profiles: [images]
    image: codeman-e2e-pod-ollama:local
    build:
      context: images
      dockerfile: pod-ollama/Dockerfile
      additional_contexts:
        base: service:pod-ollama-base
        # The fakes image, which the fakes' services build.
        fakes: service:llm
  pod-vllm:
    profiles: [images]
    image: codeman-e2e-pod-vllm:local
    platform: linux/amd64
    build:
      context: images
      dockerfile: pod-vllm/Dockerfile
      additional_contexts:
        dist: ../../dist
        fakes: service:llm

  # The job image (e2e/infra/images/runner/): the local runner image, built here as runner-base,
  # with gh and the session CA's trust. Never started: the runtime runs each job with it, on the
  # jobs network, with the `ca` volume on /etc/codeman-e2e.
  runner-base:
    profiles: [images]
    image: codeman-runner:local
    build: ../../docker/runner
  runner:
    profiles: [images]
    image: codeman-e2e-runner:local
    build:
      context: images/runner
      additional_contexts:
        runner: service:runner-base
      args:
        GITHUB_HOST: *github-host
        GITHUB_ADDRESS: *github-address

networks:
  jobs:
    name: codeman-e2e-jobs
    internal: true
    ipam:
      config:
        # Fixed addresses below .128; Docker gives the jobs and pods theirs from the range.
        - subnet: 10.250.0.0/24
          ip_range: 10.250.0.128/25
  control:
    name: codeman-e2e-control
  egress:
    name: codeman-e2e-egress

volumes:
  ca:
    name: codeman-e2e-ca
  tls:
    name: codeman-e2e-tls
  npm:
    name: codeman-e2e-npm
  ollama:
    name: codeman-e2e-ollama
  hf:
    name: codeman-e2e-hf
