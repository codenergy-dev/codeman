name: Ollama pod, kept between stages and released at the end
tags: [pods, ollama]
runner: [simulator, act]
profiles: [ollama]
timeout: 25m
world:
  organizations:
    - name: acme
      settings:
        provider: runpod-pod
        model: qwen2.5:0.5b
        gpu: NVIDIA GeForce RTX 4090
        task-budget: 2
        ollama: { num-parallel: 2 }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    # No decisions: the task is ready at once, so the pod is kept for the route.
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - output: { summary: Adds a health route., decisions: [] }
    route:
      - steps:
          - output:
              summary: Code, then review.
              route: [{ stage: code, brief: Add the route. }, { stage: review, brief: Check it. }]
              skipped: [{ stage: web, reason: No docs. }, { stage: design, reason: Settled. }, { stage: test, reason: Too small. }]
    code:
      - steps:
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - output: { status: done, summary: Adds the route., commitMessage: Add a health route }
    review:
      - steps: [{ output: { status: done, summary: The route is right. } }]
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - parallel:
      # The labeled issue's run, and the chain it starts: plan, route, code, review, each a run.
      - - run: { event: issues.labeled }
      # While the chain runs: the pod serves the real fit, and is kept between two stages.
      - - wait: { until: { pods: [{ ref: p1, status: RUNNING }] }, timeout: 10m }
        - wait:
            timeout: 10m
            until:
              engine:
                pod: p1
                gateway:
                  ready: true
                  engine: ollama
                  contextLength: 32768
                  ollama: { OLLAMA_NUM_PARALLEL: "2" }
                  fit: { source: search, parallel: 2, requestedParallel: 2, contextLength: 32768, modelContextLength: 32768 }
                # Ollama's own /api/ps, through the tee: on the virtual GPU whole, at its context.
                ollama: { models: [{ name: qwen2.5:0.5b, context_length: 32768 }] }
        - wait:
            timeout: 10m
            until:
              store:
                - collection: pools/acme/pods
                  where: { live: true, status: serving, leases: [{ kind: keep, holder: acme/app#1 }] }
                  count: 1
  - expect:
      issue: i1
      labels: [codeman:done]
      pull-request: { ready: true, files: [src/health.ts] }
  # One pod, created by the plan's open-key with the pod's settings, joined by the next stages.
  - expect:
      pods:
        - pod: p1
          status: TERMINATED
          where:
            gpu: NVIDIA GeForce RTX 4090
            cloud: SECURE
            billing: stopped
            env:
              CODEMAN_MODEL: qwen2.5:0.5b
              CODEMAN_ENGINE: ollama
              CODEMAN_OLLAMA: '{"OLLAMA_NUM_PARALLEL":"2"}'
              CODEMAN_GPU_MEMORY_GB: "24"
              CODEMAN_ORGANIZATION: acme
              CODEMAN_POOL: acme
              CODEMAN_KEPT_IDLE_MINUTES: "15"
              CODEMAN_RUN_IDLE_MINUTES: "30"
      store:
        - { collection: pools/acme/pods, count: 1 }
        - { collection: pools/acme/pods, where: { live: false, status: ended, leases: [] }, count: 1 }
        - { collection: organizations/acme/events, where: { type: pod-created }, count: 1 }
        - { collection: organizations/acme/events, where: { type: pod-joined }, count: 3 }
        - { collection: organizations/acme/events, where: { type: pod-terminated }, count: 1 }
        - { collection: organizations/acme/runs, where: { provider: runpod-pod, status: closed }, count: 4 }
      # The pod's time, at the RTX 4090's Secure price of 0.69 USD an hour, split among the runs.
      ledger: { cost-at-least: 0.001, cost-at-most: 0.3, runs: 4 }
      violations: none
