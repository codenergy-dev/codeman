# The incident of docs/plans/2026-10-15-keep-a-spent-pod-for-its-close.md: two tasks share one pod;
# one plan ends quickly, the other goes on alone on the pod until its run's share reaches its limit.
# The gateway then refuses the run's requests and, within 15 seconds, stops it, while every run on
# the pod is spent or ended. It waits for the run's close instead of terminating the pod, so
# close-key's /admin/end reads the run's usage from the gateway: its share of the pod, within its
# limit, with its requests and tokens. Before the fix, the pod terminated itself within seconds,
# close-key got 404, and the run counted the pod's whole time since it started, unsplit and without
# its tokens.
#
# The pod's price is raised to US$ 7.20 an hour, 0.002 a second, so a run's US$ 0.30 is spent in
# minutes: both runs count the pod's start at half each; i1 then counts the whole pod alone.
#
# The stopped run's requests get 402, which OpenCode does not retry: budgets/spent-run-gets-402
# checks it. This scenario does not depend on it.
name: A run that spends its budget on a shared pod is stopped, and the pod waits for its close
tags: [budgets, pods, ollama]
runner: simulator
profiles: [ollama]
timeout: 25m
world:
  organizations:
    - name: acme
      settings:
        task-budget: 0.3
        profiles:
          - { name: pair, tasks: 2, provider: runpod-pod, gpu: NVIDIA GeForce RTX 4090, model: qwen2.5:0.5b }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
  runpod:
    catalog:
      - id: NVIDIA GeForce RTX 4090
        name: RTX 4090
        pool: ADA_24
        manufacturer: NVIDIA
        memory: 24
        secure: true
        community: true
        price: { secure: 7.2, community: 3.6, serverless: 1.1 }
        maxCount: { secure: 8, community: 4 }
        availability: HIGH
        cudaVersions: [{ version: "12.8", available: true }, { version: "13.0", available: true }]
agent:
  # A long plan: each turn waits 45 seconds, about 7 minutes in all, so its run spends its limit
  # and is stopped before its output.
  i1:
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - delay: 45000
          - read: package.json
          - delay: 45000
          - read: AGENTS.md
          - delay: 45000
          - bash: ls src
          - delay: 45000
          - read: package.json
          - delay: 45000
          - bash: ls
          - delay: 45000
          - read: AGENTS.md
          - delay: 45000
          - bash: ls src
          - delay: 45000
          - read: package.json
          - output:
              summary: Adds a health route.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
  # A short plan, which closes its run while i1's goes on.
  i2:
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a version route\n' > "$plan"
          - output:
              summary: Adds a version route.
              decisions:
                - { id: 1, title: Source, question: Where does the version come from?, options: [{ key: a, label: package.json }, { key: b, label: git }], recommendation: a }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - open-issue: { ref: i2, as: alice, title: Add a version route, labels: [codeman] }
  - parallel:
      - - run: { event: issues.labeled }
      - - wait: { until: { pods: [{ ref: p1, status: RUNNING }] }, timeout: 10m }
  - expect: { issue: i2, labels: [codeman:awaiting-decision] }
  # i1's agent never got to its output: the gateway refused its requests once its run was spent.
  - expect:
      issue: i1
      no-labels: [codeman:awaiting-decision]
      fakes:
        llm:
          turns: { where: { issue: i1, kind: step, step: output }, count: 0 }
  - expect:
      store:
        # close-key read the spent run's usage from the gateway: its requests, and its share.
        - collection: organizations/acme/runs
          where: { task: 1, stage: plan, status: closed, requests: { at-least: 2 }, inputTokens: { at-least: 1 } }
          count: 1
        - collection: organizations/acme/runs
          where: { task: 2, stage: plan, status: closed, requests: { at-least: 2 } }
          count: 1
        - { collection: organizations/acme/events, where: { type: run-stopped }, count: 1 }
        - { collection: pools/acme/pods, where: { live: false, status: ended, seats: { at-least: 2, at-most: 2 } }, count: 1 }
      pods:
        - { count: 1 }
        - { pod: p1, status: TERMINATED, where: { billing: stopped } }
  # The spent run counts its limit, give or take the gateway's 15-second tick, not the pod's whole
  # time since it started.
  - expect: { issue: i1, ledger: { runs: 1, cost-at-least: 0.25, cost-at-most: 0.34 } }
  - expect: { issue: i2, ledger: { runs: 1, cost-at-most: 0.25 } }
  # The pod's time after the spent run stopped, until its close, is no run's: the pod's untracked
  # time (docs/budget/spend.md, "Untracked time"), so the runs' shares add up to less than the pod.
  - expect:
      store:
        - collection: pools/acme/pods
          where: { status: ended, counted: { at-least: 0.3, at-most: 0.4 }, untracked: { at-least: 0 } }
          count: 1
      violations: none
