# A run whose budget is spent gets 402, which OpenCode does not retry, from its pod's gateway
# (docs/inference/self-hosted.md, "The budget cut-off"), also once the gateway stopped it. Before
# the fix (docs/plans/2026-10-22-answer-a-spent-run-with-402.md), the stopped run got 503
# `run_stopped`, and the agent retried it for minutes while the pod waited for the run's close.
#
# One task on a pod at US$ 36 an hour, 0.01 a second. The run's cost counts from the pod's
# creation, which no action can move, so its first request must come before its budget is spent:
# within 180 seconds, its US$ 1.80. That is 3 times the 59 seconds it took on a loaded machine
# (load average 300); a budget of 30 seconds was spent before it. Its agent's turns go on every 20
# seconds for longer, so the spent budget, not the script, ends them.
name: A run whose budget is spent gets 402 from its pod's gateway, not a retryable 503
tags: [budgets, pods, ollama]
runner: simulator
profiles: [ollama]
timeout: 20m
world:
  organizations:
    - name: acme
      settings:
        task-budget: 1.8
        provider: runpod-pod
        model: qwen2.5:0.5b
        gpu: NVIDIA GeForce RTX 4090
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
  runpod:
    catalog:
      - id: NVIDIA GeForce RTX 4090
        name: RTX 4090
        pool: ADA_24
        manufacturer: NVIDIA
        memory: 24
        secure: true
        community: true
        price: { secure: 36, community: 18, serverless: 1.1 }
        maxCount: { secure: 8, community: 4 }
        availability: HIGH
        cudaVersions: [{ version: "12.8", available: true }, { version: "13.0", available: true }]
agent:
  i1:
    plan:
      - steps:
          - bash: ls
          - delay: 20000
          - bash: ls src
          - delay: 20000
          - read: package.json
          - delay: 20000
          - read: AGENTS.md
          - delay: 20000
          - bash: ls
          - delay: 20000
          - bash: ls src
          - delay: 20000
          - read: package.json
          - delay: 20000
          - read: AGENTS.md
          - delay: 20000
          - bash: ls
          - delay: 20000
          - bash: ls src
          - delay: 20000
          - read: package.json
          - delay: 20000
          - read: AGENTS.md
          - delay: 20000
          - bash: ls
          - delay: 20000
          - bash: ls src
          - delay: 20000
          - read: package.json
          - delay: 20000
          - bash: ls
          - output: { summary: Not reached., decisions: [] }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - run: { event: issues.labeled }
  - expect:
      issue: i1
      no-labels: [codeman:awaiting-decision, codeman:ready]
      store:
        - { collection: organizations/acme/runs, where: { stage: plan, status: closed, requests: { at-least: 1 } }, count: 1 }
      # The agent's requests through the pod's proxy: refused with 402 once its run is spent, and
      # never with 503, which it would retry.
      fakes:
        runpod:
          requests: { where: { method: POST, status: 402 }, count: { at-least: 1 } }
  - expect:
      fakes:
        runpod:
          requests: { where: { method: POST, status: 503 }, count: 0 }
      violations: none
