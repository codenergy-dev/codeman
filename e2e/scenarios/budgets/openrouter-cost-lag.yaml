# The 0-cost bug of docs/plans/2026-10-15-refresh-openrouter-costs-from-any-run.md: a plan run on
# OpenRouter reads its cost before OpenRouter shows the key's usage, so its close-key records 0.
# Once the lag has passed, the task's next run corrects it, whatever its provider: here routing,
# code and review run on a Serverless endpoint, whose open-key and close-key list the task's
# OpenRouter keys and refresh the plan run's cost in the ledger.
name: OpenRouter's lagging usage reads 0 at the plan's close, and a later Serverless run refreshes it
tags: [budgets, openrouter, serverless]
runner: simulator
timeout: 20m
world:
  organizations:
    - { name: acme, settings: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
  # OpenRouter shows no request on a key's usage, nor in its analytics, until the scenario lets it.
  openrouter:
    lags: { usage: hold, analytics: hold }
  runpod:
    endpoints:
      - id: qwensmall
        type: QUEUE
        workers: { min: 0, max: 1, idleTimeout: 60 }
        gpu: { pools: [ADA_24] }
        env:
          MODEL_NAME: Qwen/Qwen2.5-0.5B-Instruct
          MAX_MODEL_LEN: "32768"
          ENABLE_AUTO_TOOL_CHOICE: "true"
          TOOL_CALL_PARSER: hermes
agent:
  i1:
    plan:
      - usage: { prompt: 20000, completion: 1000 }
        steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - output:
              summary: Adds a health route.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
    route:
      - steps:
          - output:
              summary: Code, then review.
              route: [{ stage: code, brief: Add the route. }, { stage: review, brief: Check it. }]
              skipped: [{ stage: web, reason: No docs. }, { stage: design, reason: Settled. }, { stage: test, reason: Too small. }]
    code:
      - steps:
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - output: { status: done, summary: Adds the route., commitMessage: Add a health route }
    review:
      - steps: [{ output: { status: done, summary: The route is right. } }]
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - run: { event: issues.labeled }
  # The key spent its requests (each reply reports 20,000 prompt and 1,000 completion tokens), but
  # its usage still shows 0, so close-key recorded a cost of 0.
  - expect:
      issue: i1
      labels: [codeman:awaiting-decision]
      store:
        - { collection: organizations/acme/runs, where: { stage: plan, provider: openrouter, status: closed, cost: 0 }, count: 1 }
      fakes:
        openrouter:
          keys: { where: { usage: 0, spend: { at-least: 0.05 } }, count: 1 }
  # OpenRouter catches up; the task's next runs go to a Serverless endpoint.
  - fault: { openrouter: { lags: { usage: 0s, analytics: 0s } } }
  - set-variable:
      org: acme
      value: { task-budget: 2, provider: runpod-serverless, endpoint: qwensmall, model: Qwen/Qwen2.5-0.5B-Instruct }
  - comment: { issue: i1, as: alice, body: /codeman decide 1 a }
  - advance: { until: { issue: i1, labels: [codeman:done] }, max-runs: 6 }
  - expect:
      issue: i1
      store:
        # The plan run now costs what its key spent, refreshed by a run on another provider.
        - collection: organizations/acme/runs
          where: { stage: plan, provider: openrouter, status: closed, cost: { at-least: 0.05, at-most: 0.5 } }
          count: 1
        - { collection: organizations/acme/runs, where: { stage: route, provider: runpod-serverless, status: closed }, count: 1 }
        - { collection: organizations/acme/runs, where: { provider: runpod-serverless, status: closed }, count: 3 }
      fakes:
        openrouter:
          keys: { where: { usage: { at-least: 0.05 } }, count: 1 }
      ledger: { cost-at-least: 0.05, cost-at-most: 2 }
      violations: none
