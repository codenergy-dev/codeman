# A routing run that the monthly budget, or the organization's, refuses only waits to try again
# later: it updates the panel, and posts no run comment (docs/tasks/comments.md, "Run comments";
# docs/plans/2026-10-19-keep-routing-quiet-on-budget-waits.md). Once the month has room, routing
# runs and posts its run comment.
name: Routing refused by the month's budgets updates the panel only, then routes once there is room
tags: [budgets, openrouter, comments]
runner: simulator
timeout: 20m
world:
  organizations:
    - { name: acme, settings: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - output:
              summary: Adds a health route.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
    route:
      - steps:
          - output:
              summary: Code, then review.
              route: [{ stage: code, brief: Add the route. }, { stage: review, brief: Check it. }]
              skipped: [{ stage: web, reason: No docs. }, { stage: design, reason: Settled. }, { stage: test, reason: Too small. }]
    code:
      - steps:
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - output: { status: done, summary: Adds the route., commitMessage: Add a health route }
    review:
      - steps: [{ output: { status: done, summary: The route is right. } }]
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - run: { event: issues.labeled }
  - expect: { issue: i1, labels: [codeman:awaiting-decision], comments: [{ kind: run, count: 1 }] }
  # The month now holds less than the routing run's limit, what is left of the task's US$ 2.
  - set-variable: { org: acme, value: { model: deepseek/deepseek-v4.1-flash, task-budget: 2, monthly-budget: 1 } }
  # The answer's run records it, with its run comment ("Answers recorded"); the next run picks
  # routing, which the month refuses.
  - comment: { issue: i1, as: alice, body: /codeman decide 1 a }
  - advance:
      max-runs: 2
      until:
        store:
          - { collection: organizations/acme/runs, where: { stage: route, status: refused, refusal: over-budget }, count: 1 }
  - expect:
      issue: i1
      labels: [codeman:ready]
      comments:
        - { kind: status, contains: The monthly budget is reached }
        - { kind: run, count: 2 }
  # Two more runs pick routing, and wait for the month again, quietly.
  - run: { event: workflow_dispatch }
  - run: { event: workflow_dispatch }
  - expect:
      issue: i1
      labels: [codeman:ready]
      comments:
        - { kind: status, contains: The monthly budget is reached }
        - { kind: run, count: 2 }
      store:
        - { collection: organizations/acme/runs, where: { stage: route, status: refused, refusal: over-budget }, count: 3 }
  # The organization's month refuses it the same way.
  - set-variable: { org: acme, value: { model: deepseek/deepseek-v4.1-flash, task-budget: 2, organization-monthly-budget: 1 } }
  - run: { event: workflow_dispatch }
  - expect:
      issue: i1
      labels: [codeman:ready]
      comments:
        - { kind: status, contains: "The organization's monthly budget is reached" }
        - { kind: run, count: 2 }
      store:
        - { collection: organizations/acme/runs, where: { stage: route, status: refused, refusal: over-organization-budget }, count: 1 }
  # With room again, routing runs and posts its run comment, and the task goes on to done: one run
  # comment for each of plan, the answers, route, code and review, none for the four refused
  # routing runs.
  - set-variable: { org: acme, value: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  - run: { event: workflow_dispatch }
  - expect:
      issue: i1
      labels: [codeman:done]
      comments: [{ kind: run, count: 5 }, { kind: run, contains: Answers recorded }, { kind: run, contains: "Code, then review." }]
      store:
        - { collection: organizations/acme/runs, where: { stage: route, status: closed }, count: 1 }
        - { collection: organizations/acme/runs, where: { stage: route, status: refused }, count: 4 }
      violations: none
