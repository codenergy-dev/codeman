# The workflow does not pass the secret of the run's provider: the repository has no OpenRouter
# management key. open-key refuses the run with `missing-credentials` before it reserves anything,
# its ledger run is `refused` with a reason that names the secret, and apply blocks the task with
# the documented message and that reason as its error (docs/budget/budget.md, "Outcomes of
# open-key"; docs/tasks/lifecycle.md, "Blocked, and how to go on"). No key is made, no model is
# asked, and next-run starts no other run.
name: A missing provider secret refuses the run with missing-credentials and blocks the task
tags: [failures, openrouter]
runner: simulator
world:
  organizations:
    - { name: acme, settings: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice], secrets: [runpod, runpod-serverless] }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - run: { event: issues.labeled }
  - expect:
      issue: i1
      labels: [codeman:blocked]
      no-labels: [codeman:planning]
      comments:
        - kind: run
          contains:
            - "Codeman could not give this run access to its model: the workflow does not pass the secret of a provider the run needs"
            - CODEMAN_OPENROUTER_MANAGEMENT_KEY
            - Remove the `codeman:blocked` label to try again.
        - kind: status
          contains: the workflow does not pass the secret of a provider the run needs
      pull-request: none
      ledger: { runs: 1, cost-at-most: 0 }
      store:
        - collection: organizations/acme/runs
          where: { status: refused, refusal: missing-credentials, stage: plan, provider: openrouter }
          count: 1
        - collection: organizations/acme/events
          where: { type: key-refused, status: missing-credentials }
          count: 1
        - { collection: organizations/acme/events, where: { type: key-opened }, count: 0 }
      fakes:
        openrouter:
          keys: { count: 0 }
          requests: { where: { method: POST, path: /api/v1/keys }, count: 0 }
        github:
          dispatches: { count: 0 }
        llm:
          turns: { count: 0 }
      violations: none
