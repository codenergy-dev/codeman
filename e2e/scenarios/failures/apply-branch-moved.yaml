# A maintainer pushes to the task branch while the code stage's agent works, and changes the file
# the agent writes. apply commits on the head select saw and never forces the branch, so GitHub
# refuses the update (422 "Update is not a fast forward") and the maintainer's commit is kept.
# apply then compares what the new commit changed with the run's paths: they share
# src/health.ts, so it commits nothing and blocks the task, naming the path in the run comment
# (docs/runs/changes.md, "When the branch moved during the run"; docs/tasks/lifecycle.md,
# "Blocked, and how to go on"). `/codeman continue` runs the code stage again from the maintainer's
# commit, which finishes the task.
name: apply keeps a maintainer's commit on the task branch, and blocks on the paths both changed
tags: [failures, openrouter]
runner: simulator
timeout: 20m
world:
  organizations:
    - { name: acme, settings: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - output: { summary: Adds a health route., decisions: [] }
    route:
      - steps:
          - output:
              summary: Code, then review.
              route: [{ stage: code, brief: Add the route. }, { stage: review, brief: Check it. }]
              skipped: [{ stage: web, reason: No docs. }, { stage: design, reason: Settled. }, { stage: test, reason: Too small. }]
    code:
      # The maintainer pushes while this round works: it waits 20 seconds before its output.
      - steps:
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - delay: 20000
          - output: { status: done, summary: Adds the route., commitMessage: Add a health route }
      # After the continue, from the maintainer's commit.
      - steps:
          - bash: grep -q 'ok = false' src/health.ts
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - output: { status: done, summary: Adds the route again., commitMessage: Add a health route }
    review:
      - steps: [{ output: { status: done, summary: The route is right. } }]
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - parallel:
      - - run: { event: issues.labeled }
      - - wait:
            timeout: 10m
            until: { fakes: { llm: { turns: { where: { stage: code, kind: step }, count: { at-least: 1 } } } } }
        - push: { task: i1, as: alice, files: { src/health.ts: "export const ok = false;\n" }, message: A maintainer's commit }
  # The maintainer's commit is kept, and is the branch's last: the plan's, then theirs.
  - expect:
      issue: i1
      labels: [codeman:blocked]
      comments:
        - kind: run
          contains:
            - "Code stage: blocked"
            - The task branch moved during the run.
            - "The new commits change paths this run changed too: src/health.ts."
            - Comment `/codeman continue <guidance>` to try again.
      commits: { message: A maintainer's commit, count: 2, files: [src/health.ts] }
      store:
        - { collection: organizations/acme/runs, where: { status: closed, stage: code }, count: 1 }
  - comment: { issue: i1, as: alice, body: /codeman continue }
  - advance: { until: { issue: i1, labels: [codeman:done] }, max-runs: 4 }
  - expect:
      issue: i1
      commits: { message: Add a health route }
      pull-request: { ready: true, files: [src/health.ts] }
      store:
        - { collection: organizations/acme/runs, where: { status: closed, stage: code }, count: 2 }
      violations: none
