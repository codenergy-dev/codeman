name: OpenRouter, from a labeled issue to done
tags: [happy-path, openrouter]
runner: simulator
world:
  organizations:
    - { name: acme, settings: { model: deepseek/deepseek-v4.1-flash, task-budget: 2 } }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan:
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# Add a health route\n' > "$plan"
          - output:
              summary: Adds a health route.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
    route:
      - steps:
          - output:
              summary: Code, then review.
              route: [{ stage: code, brief: Add the route. }, { stage: review, brief: Check it. }]
              skipped: [{ stage: web, reason: No docs. }, { stage: design, reason: Settled. }, { stage: test, reason: Too small. }]
    code:
      - usage: { prompt: 1200, completion: 300 }
        steps:
          - write: { path: src/health.ts, content: "export const ok = true;\n" }
          - output: { status: done, summary: Adds the route., commitMessage: Add a health route }
    review:
      - steps: [{ output: { status: done, summary: The route is right. } }]
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - run: { event: issues.labeled }
  - expect: { issue: i1, labels: [codeman:awaiting-decision], comments: [{ kind: decisions, contains: Which port? }] }
  - comment: { issue: i1, as: alice, body: /codeman decide 1 a }
  - advance: { until: { issue: i1, labels: [codeman:done] }, max-runs: 6 }
  - expect: { issue: i1, pull-request: { ready: true, files: [src/health.ts] }, ledger: { cost-at-most: 2 }, violations: none }
