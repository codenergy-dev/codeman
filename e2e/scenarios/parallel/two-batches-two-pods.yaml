# The plan's parallel/five-tasks-two-pods, scaled down to fit Docker's memory (docs/plans/
# 2026-10-20-end-to-end-test-suite.md, 5.2 results): 5 tasks on 2 pods at once need 5 agent jobs
# and 2 pods, about 8.5 GiB. Here 2 planning tasks form 2 batches of 1 in one run, whose cap of 2
# comes from another profile. Both batches want the same pod settings, with one parallel request:
# the second task finds the first pod full, and creates another (docs/inference/pods.md,
# "Capacity").
name: Two batches on the same settings in one run get two pods, one creator each
tags: [parallel, ollama, pods]
runner: simulator
profiles: [ollama]
timeout: 20m
world:
  organizations:
    - name: acme
      settings:
        task-budget: 2
        profiles:
          - { name: solo, stages: [plan], tasks: 1, provider: runpod-pod, gpu: NVIDIA GeForce RTX 4090, model: qwen2.5:0.5b }
          # Never applies to a plan: it only makes the run take 2 tasks.
          - { name: pair, stages: [route, code, review], max-tasks: 2, model: deepseek/deepseek-v4.1-flash }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan: &plan
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# A small change\n' > "$plan"
          - output:
              summary: Plans a small change.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
  i2: { plan: *plan }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - open-issue: { ref: i2, as: alice, title: Add a version route, labels: [codeman] }
  - parallel:
      - - run: { event: issues.labeled }
      # Two pods serve at once, each with one parallel request of the model's whole context.
      - - wait: { until: { pods: [{ status: RUNNING, count: 2 }] }, timeout: 10m }
        - expect: { pods: [{ ref: p1, status: RUNNING, where: { env: { CODEMAN_OLLAMA: '{"OLLAMA_NUM_PARALLEL":"1"}' } } }] }
        - wait:
            timeout: 10m
            until:
              engine:
                pod: p1
                gateway:
                  ready: true
                  ollama: { OLLAMA_NUM_PARALLEL: "1" }
                  fit: { source: search, parallel: 1, requestedParallel: 1, contextLength: 32768 }
                ollama: { models: [{ name: qwen2.5:0.5b, context_length: 32768 }] }
                tee: { runners: [{ parallel: 1, context: 32768 }] }
  - expect: { issue: i1, labels: [codeman:awaiting-decision], comments: [{ kind: decisions, contains: Which port? }] }
  - expect: { issue: i2, labels: [codeman:awaiting-decision], comments: [{ kind: decisions, contains: Which port? }] }
  - expect:
      pods:
        - { status: TERMINATED, count: 2, where: { billing: stopped, env: { CODEMAN_OLLAMA: '{"OLLAMA_NUM_PARALLEL":"1"}' } } }
      store:
        # Two batches of 1, one pod each: each pod has one creator and one seat, its batch's.
        - { collection: pools/acme/batches, where: { size: 1, profile: solo }, count: 2 }
        - { collection: pools/acme/pods, count: 2 }
        - { collection: pools/acme/pods, where: { live: false, status: ended, capacity: 1, seats: { at-least: 1, at-most: 1 } }, count: 2 }
        - { collection: pools/acme/pods, where: { claimedBy: acme/app#1, seats: [acme/app#1] }, count: 1 }
        - { collection: pools/acme/pods, where: { claimedBy: acme/app#2, seats: [acme/app#2] }, count: 1 }
        - { collection: organizations/acme/events, where: { type: pod-created }, count: 2 }
        - { collection: organizations/acme/events, where: { type: pod-joined }, count: 0 }
        - { collection: organizations/acme/events, where: { type: pod-terminated }, count: 2 }
        - { collection: organizations/acme/runs, where: { provider: runpod-pod, status: closed, stage: plan, profile: solo }, count: 2 }
      fakes:
        runpod:
          requests: { where: { method: POST, path: /v2/pods }, count: 2 }
      ledger: { runs: 2, cost-at-least: 0.0001, cost-at-most: 0.2 }
      violations: none
