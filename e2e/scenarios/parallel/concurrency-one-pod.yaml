# A profile's concurrency on pods (docs/settings/profiles.md, "Concurrency"; docs/inference/
# pods.md, "Capacity"): the setup of two-batches-two-pods, but with `concurrency: 1`. The first
# run's batch of 1 takes solo's one pod, and the other task waits instead of creating a second.
# Once i1's run closes and its pod ends, next-run's run plans i2 on a pod of its own: never two
# pods at once.
name: A pod profile with concurrency 1 serves one batch at a time, and the other task waits
tags: [parallel, ollama, pods, concurrency]
runner: simulator
profiles: [ollama]
timeout: 25m
world:
  organizations:
    - name: acme
      settings:
        task-budget: 2
        profiles:
          - { name: solo, stages: [plan], tasks: 1, concurrency: 1, provider: runpod-pod, gpu: NVIDIA GeForce RTX 4090, model: qwen2.5:0.5b }
          # Never applies to a plan: it only makes the run take 2 tasks.
          - { name: pair, stages: [route, code, review], max-tasks: 2, model: deepseek/deepseek-v4.1-flash }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan: &plan
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# A small change\n' > "$plan"
          - output:
              summary: Plans a small change.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
  i2: { plan: *plan }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - open-issue: { ref: i2, as: alice, title: Add a version route, labels: [codeman] }
  - parallel:
      # The run plans i1 on solo's pod, then next-run's run plans i2 on another.
      - - run: { event: issues.labeled }
      # Meanwhile, i2 waits for solo's one pod, which serves i1 alone.
      - - wait:
            timeout: 10m
            until:
              issue: i2
              comments: [{ kind: status, contains: "Waiting for profile `solo`: its one instance is busy" }]
        - expect: { pods: [{ count: 1 }], store: [{ collection: pools/acme/pods, count: 1 }] }
  - expect: { issue: i1, labels: [codeman:awaiting-decision] }
  - expect: { issue: i2, labels: [codeman:awaiting-decision] }
  - expect:
      pods:
        - { status: TERMINATED, count: 2, where: { billing: stopped } }
      store:
        # One creator each, one after the other.
        - { collection: pools/acme/pods, where: { live: false, status: ended, capacity: 1 }, count: 2 }
        - { collection: organizations/acme/events, where: { type: pod-created }, count: 2 }
        - { collection: organizations/acme/runs, where: { provider: runpod-pod, status: closed, stage: plan, profile: solo }, count: 2 }
        - { collection: organizations/acme/runs, where: { status: refused }, count: 0 }
      ledger: { runs: 2, cost-at-least: 0.0001, cost-at-most: 0.2 }
      violations: none
