# A profile's concurrency on OpenRouter (docs/settings/profiles.md, "Concurrency"): the run could
# take 2 tasks, as another profile's count allows, but `solo` serves one task per instance and
# runs one instance at a time. The first run plans i1 and holds i2 back, saying why on its panel;
# next-run's run plans i2 once i1's run closed.
name: A profile with concurrency 1 runs one batch at a time on OpenRouter, and the other task waits
tags: [parallel, openrouter, concurrency]
runner: simulator
timeout: 20m
world:
  organizations:
    - name: acme
      settings:
        task-budget: 2
        profiles:
          - { name: solo, stages: [plan], tasks: 1, concurrency: 1, model: deepseek/deepseek-v4.1-flash }
          # Never applies to a plan: it only makes the run take 2 tasks.
          - { name: pair, stages: [route, code, review], max-tasks: 2, model: deepseek/deepseek-v4.1-flash }
  repositories:
    - { name: acme/app, fixture: node-small, maintainers: [alice] }
agent:
  i1:
    plan: &plan
      - steps:
          - bash: plan=$(sed -n 's/.*Create the plan at `\([^`]*\)`.*/\1/p' .codeman/task.md) && mkdir -p "$(dirname "$plan")" && printf '# A small change\n' > "$plan"
          - output:
              summary: Plans a small change.
              decisions:
                - { id: 1, title: Port, question: Which port?, options: [{ key: a, label: "8080" }, { key: b, label: "3000" }], recommendation: a }
  i2: { plan: *plan }
actions:
  - open-issue: { ref: i1, as: alice, title: Add a health route, labels: [codeman] }
  - open-issue: { ref: i2, as: alice, title: Add a version route, labels: [codeman] }
  - parallel:
      # The run plans i1, then next-run's run plans i2.
      - - run: { event: issues.labeled }
      # Meanwhile, i2 waits for solo's one instance, until i1's run closed.
      - - wait:
            timeout: 5m
            until:
              issue: i2
              comments: [{ kind: status, contains: "Waiting for profile `solo`: its one instance is busy" }]
  - expect: { issue: i1, labels: [codeman:awaiting-decision] }
  - expect: { issue: i2, labels: [codeman:awaiting-decision] }
  - expect:
      store:
        - { collection: organizations/acme/runs, where: { provider: openrouter, status: closed, stage: plan, profile: solo }, count: 2 }
        - { collection: organizations/acme/runs, where: { status: refused }, count: 0 }
      ledger: { runs: 2 }
      violations: none
